    <!-- Theme boot: applies the saved theme before the first paint so launch never flashes the
         wrong colours (mirrors src/theme/themeConfig.ts; kept in sync by tests/unit/theme.test.ts). -->
    <script>
      (function () {
        var chrome = {
          dark: { themeColor: '#12161c', colorScheme: 'dark', statusBarStyle: 'black-translucent' },
          light: { themeColor: '#f6f6f6', colorScheme: 'light', statusBarStyle: 'default' }
        };
        var preference = 'dark';
        try {
          var stored = JSON.parse(localStorage.getItem('webtop-pwa:theme') || 'null');
          if (stored && (stored.data === 'light' || stored.data === 'dark' || stored.data === 'system')) preference = stored.data;
        } catch (error) {
          /* storage unavailable: keep the default */
        }
        var theme = preference;
        if (preference === 'system') {
          theme = window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var setMeta = function (name, value) {
          var meta = document.querySelector('meta[name="' + name + '"]');
          if (meta) meta.setAttribute('content', value);
        };
        setMeta('theme-color', chrome[theme].themeColor);
        setMeta('color-scheme', chrome[theme].colorScheme);
        setMeta('apple-mobile-web-app-status-bar-style', chrome[theme].statusBarStyle);
      })();
    </script>
